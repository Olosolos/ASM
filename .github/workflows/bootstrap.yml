name: Bootstrap ASM website from verified source archive
on:
  push:
    branches: [main]
    paths:
      - '.transfer/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part*.bin > /tmp/asm-source.zip
          echo '2ec11c36b1ddb7f2e5bc5aeb3a28af9f3df7a217c7b52f18a1ea484bfac05643  /tmp/asm-source.zip' | sha256sum --check --status
          unzip -tq /tmp/asm-source.zip
          unzip -oq /tmp/asm-source.zip -d .
          test -f package.json
          test -f scripts/build.mjs
          test -f .github/workflows/deploy.yml
      - name: Commit editable source and original assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: import full ASM Inc website source and original assets"
          git push origin HEAD:main
